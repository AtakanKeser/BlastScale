# Minimal load balancer in front of the stateless API replicas.
#
# `docker compose up --scale api=3` starts three API containers. Docker's embedded DNS
# (127.0.0.11) returns all replica IPs for the "api" hostname, and because proxy_pass uses a
# variable, nginx re-resolves the name every few seconds and round-robins across replicas.
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;

    log_format upstreamlog '$remote_addr "$request" $status upstream=$upstream_addr rt=$request_time';
    access_log /dev/stdout upstreamlog;

    server {
        listen 8080;

        location / {
            # Using a variable forces nginx to resolve "api" at request time instead of once at startup.
            set $api_upstream http://api:8080;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
